# Builds the three packaged apps.
#
# Nothing is built on Omar's machine: Tauri's toolchain is 15-20 GB and his
# disk does not have it. GitHub gives a Windows runner and a Linux runner for
# free, so the Windows installer is built on actual Windows rather than
# cross-compiled, which is one less thing to go wrong.
#
# Run it from the Actions tab (Run workflow), or push a tag like v1.0.0 to get
# a release with all three files attached.

name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The packaged apps talk to the deployed Worker, which is a different origin
# from the app itself, so they need the API address compiled in.
#
# This is the address `wrangler deploy` printed on 2026-09-15. A workers.dev
# address carries the account's own subdomain, so it cannot be guessed: if the
# Worker is ever renamed or moved to a custom domain, correct it here or the
# packaged apps will not reach the server. The web version is unaffected — it
# is served by the Worker itself and so is same-origin.
env:
  VITE_API_BASE: https://casacava-invoice.casacavainvoice.workers.dev

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build the web app
        run: deno task build:web
      - name: Build the installer
        shell: bash
        run: |
          # Tauri's own message is the only thing that explains a failure here,
          # and a private repository's logs cannot be read without signing in.
          # Repeat the tail of it as a workflow error, which shows up as an
          # annotation on the run page and in the API.
          set -o pipefail
          if ! deno run -A npm:@tauri-apps/cli build --verbose --bundles nsis 2>&1 | tee build.log; then
            echo "::error::$(tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CasaCava-Invoices-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    # 24.04, not 22.04: GitHub begins deprecating the Ubuntu 22 image on
    # 2026-09-17 and fails jobs that use it during the brownout periods, so a
    # workflow pinned to it would start failing at random for no reason of its
    # own. An AppImage built here needs glibc 2.39 or newer on the machine that
    # runs it — every current distribution has it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the GTK and WebKit libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - name: Build the web app
        run: deno task build:web
      - name: Build the AppImage
        shell: bash
        run: |
          # Tauri's own message is the only thing that explains a failure here,
          # and a private repository's logs cannot be read without signing in.
          # Repeat the tail of it as a workflow error, which shows up as an
          # annotation on the run page and in the API.
          set -o pipefail
          if ! deno run -A npm:@tauri-apps/cli build --verbose --bundles appimage 2>&1 | tee build.log; then
            echo "::error::$(tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CasaCava-Invoices-Linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android action: the runner image already carries the whole SDK
      # at /usr/local/lib/android/sdk with three NDKs preinstalled, and the
      # action failed in 8 seconds on both v3 and v4. Pick the r27 NDK that is
      # already there rather than asking sdkmanager to download a version that
      # is not — 27.2.12479018 was never on this image.
      - name: Find the NDK the image already has
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No NDK found under $ANDROID_HOME/ndk"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "Using NDK $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build the web app
        run: deno task build:web
      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          if ! { deno run -A npm:@tauri-apps/cli android init \
                 && deno run -A npm:@tauri-apps/cli android build --apk --debug; } 2>&1 | tee build.log; then
            echo "::error::$(tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CasaCava-Invoices-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

  release:
    name: Attach everything to the release
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*
          body: |
            Unsigned builds. On first run you will see a warning:

            - **Windows** — SmartScreen says "Windows protected your PC".
              Click *More info*, then *Run anyway*.
            - **Android** — "For your security, your phone is not allowed to
              install unknown apps from this source". Allow it for the app you
              are installing from (usually Files or Chrome), then tap install.
              The APK is signed with Android's standard debug key, because an
              unsigned one cannot be installed at all. It works normally; it
              just is not signed by a paid certificate.
            - **Linux** — `chmod +x` the AppImage before running it.

            These warnings are because the files are not signed by a paid
            certificate, not because anything is wrong with them.
